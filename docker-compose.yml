# 本地开发用 MongoDB（配合 server/.env 的 MONGODB_URI=mongodb://localhost:27018/sayhi）
# 使用：docker compose up -d    停止：docker compose stop    数据保存在 named volume，重建容器不丢
# 注意：宿主端口用 27018，27017 已被本机 knowledge_hub 项目的 MongoDB 容器占用
services:
  mongo:
    image: mongo:7
    container_name: sayhi-mongo
    restart: unless-stopped
    ports:
      # 仅绑定本机回环地址，不暴露到局域网；容器内仍是标准 27017
      - "127.0.0.1:27018:27017"
    volumes:
      - sayhi-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # MongoDB 可视化管理界面；宿主 8081 已被占用，故用 8082
  # 访问：http://localhost:8082 ，无登录弹窗（见下方 BASICAUTH 说明）
  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: sayhi-mongo-express
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8081"
    environment:
      # 走 compose 内部网络直连 mongo 服务，端口是容器内的标准 27017（不是宿主 27018）
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true" # 显示所有库，而不只是默认库
      # 镜像默认开了 HTTP Basic Auth（Dockerfile 里 ME_CONFIG_BASICAUTH=true），
      # 会在浏览器里弹原生登录框，这里显式关掉。
      # 想重新打开：本行改为 "true"，并补上
      #   ME_CONFIG_BASICAUTH_USERNAME: admin
      #   ME_CONFIG_BASICAUTH_PASSWORD: <密码>
      # 安全性由 127.0.0.1 回环绑定兜底，仅本机可访问。
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  sayhi-mongo-data:
