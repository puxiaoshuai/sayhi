# 宝塔站点 sayhi.puxiaoshuai.top 的反向代理片段
#
# 放哪儿：宝塔 → 网站 → sayhi.puxiaoshuai.top → 设置 → 配置文件，
# 在 server { } 内用下面这段替换掉宝塔默认生成的 location / { root ... }。
#
# 为什么不直接用宝塔的「反向代理」按钮：那个按钮生成的配置里没有
# client_max_body_size，语音识别会被 Nginx 用 413 拦在 Nest 之前 ——
# 而 Nest 侧是好的（main.ts 里放宽到 12mb），排查时极易误判成后端问题。

location / {
    proxy_pass http://127.0.0.1:8121;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ★ 必需。ASR 把整段录音转 base64 走 JSON 上传，60 秒录音约 480KB，
    #   但后端闸门是 10MB，客户端也可能传大文件；Nginx 默认 1m 会先返回 413。
    client_max_body_size 16m;

    # ★ 必需。场景首次生成 3~5s，翻译拆解 5~10s，默认 60s 偶发 504。
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;
}

# 路径不用改写：小程序里拼的是 `${BASE_URL}/api${url}`，即
# https://sayhi.puxiaoshuai.top/api/xxx → 代理到 127.0.0.1:8121/api/xxx，
# 而后端 setGlobalPrefix('api')，正好对上。
#
# 另外两件事不在这份文件里，但在宝塔面板上必须做：
#   1. SSL  → 设置 → SSL → Let's Encrypt 申请证书，并打开「强制 HTTPS」
#             （微信要求 TLS ≥ 1.2，宝塔默认配置满足）
#   2. 证书申请走 80 端口校验，所以域名必须先解析到这台机且 80 未被占用
